name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: openless-local-lite-v1.0.0-local.2
      prerelease:
        description: Mark this release as prerelease
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "openless-local-lite-v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openless-all/app

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows setup exe
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openless-local-lite-windows-setup
          path: openless-all/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OpenLess Local Lite ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            OpenLess Local Lite Windows build.

            This release keeps the local-first dictation, polish, style, personalization, history, and vocabulary features, removes marketplace/updater/translation/selection QA/community links, and does not install a Windows input method.
          prerelease: ${{ github.event.inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: openless-all/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
