name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: openless-local-lite-v1.0.0-local.0
      prerelease:
        description: Mark this release as prerelease
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "openless-local-lite-v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openless-all/app

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build x64/x86 TSF IME DLLs
        shell: pwsh
        run: |
          $imeRoot = Join-Path $PWD "src-tauri/target/windows-ime-msvc"
          $targets = @(
            @{ Platform = "x64"; Folder = "x64"; EnvName = "OPENLESS_IME_DLL_X64" },
            @{ Platform = "Win32"; Folder = "x86"; EnvName = "OPENLESS_IME_DLL_X86" }
          )

          foreach ($target in $targets) {
            $outDir = Join-Path $imeRoot "$($target.Folder)/Release"
            $intDir = Join-Path $imeRoot "obj/$($target.Folder)/Release"
            ./scripts/windows-ime-build.ps1 `
              -Configuration Release `
              -Platform $target.Platform `
              -OutputDirectory $outDir `
              -IntermediateDirectory $intDir

            $dll = Join-Path $outDir "OpenLessIme.dll"
            if (-not (Test-Path $dll)) {
              throw "OpenLessIme.dll was not produced: $dll"
            }
            "$($target.EnvName)=$((Resolve-Path $dll).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Windows setup exe
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openless-local-lite-windows-setup
          path: openless-all/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OpenLess Local Lite ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            OpenLess Local Lite Windows build.

            This release keeps the local-first dictation, polish, style, personalization, history, and vocabulary features, and removes marketplace, updater, translation, selection QA, and community/product links.
          prerelease: ${{ github.event.inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: openless-all/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
