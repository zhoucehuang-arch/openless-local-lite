name: Local Build Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install frontend dependencies
        working-directory: openless-all/app
        run: npm ci

      - name: Build frontend
        working-directory: openless-all/app
        run: npm run build

      - name: Build Tauri app
        working-directory: openless-all/app
        run: npm run tauri -- build

      - name: Upload local artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openless-local-${{ runner.os }}
          path: |
            openless-all/app/src-tauri/target/release/bundle/**
